spring.application.name=grocery-store-backend

# DB Config (Fallback to local for safety)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver specify kar do taaki koi confusion na rahe
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
file.upload-dir=uploads/products

# Environment variable ka name use karein bina extra text ke
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
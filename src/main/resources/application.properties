# suppress inspection "UnusedProperty" for whole file
spring.application.name= spring-boot-profiles

spring.datasource.url= ${SPRING_DATASOURCE_URL}
spring.datasource.username= ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql= true
file.upload-dir = uploads/products

# Dynamic CORS Origins (Comma separated for multiple environments)
app.cors.allowed-origins=http://localhost:5173,https://your-production-domain.com